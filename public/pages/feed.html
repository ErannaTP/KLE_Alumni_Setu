<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni Setu - Feed</title>

  <!-- Tailwind + Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* -------------------------------------------------------- */
    /*       🎨 PURPLE PREMIUM GLOW — MAIN THEME STYLING        */
    /* -------------------------------------------------------- */

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #f3f0ff, #ffffff);
      color: #1a1a1c;
      overflow-x: hidden;
    }

    .user-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      color: #78350f;
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.35);
      letter-spacing: 0.3px;
    }

    /* Sidebar */
    .sidebar {
      background: #ffffff;
      border-right: 1px solid #e4dbff;
      box-shadow: 6px 0 18px rgba(80, 0, 200, 0.08);
      border-radius: 0 20px 20px 0;
    }

    /* Navigation Buttons */
    .nav-button {
      transition: 0.25s;
      font-weight: 500;
      border-radius: 12px;
    }

    .nav-button:hover {
      background-color: #f1e8ff;
      transform: translateX(4px);
    }

    .active-nav {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white !important;
      font-weight: 600;
      box-shadow: 0 3px 12px rgba(123, 48, 255, 0.4);
    }

    /* Apple-like inputs with purple glow */
    .input-apple {
      background: #ffffff;
      border: 1px solid #d6ccff;
      padding: 10px 14px;
      border-radius: 12px;
      transition: 0.25s;
    }

    .input-apple:focus {
      outline: none;
      border-color: #9d5cff;
      box-shadow: 0 0 0 4px rgba(140, 82, 255, 0.25);
    }

    /* Premium glowing post cards */
    .post-card,
    .post-upload-section {
      background: #ffffff;
      border-radius: 22px;
      padding: 26px;
      border: 1px solid #eadcff;
      box-shadow:
        0 8px 22px rgba(90, 20, 200, 0.08),
        0 2px 8px rgba(90, 20, 200, 0.05);
      transition: 0.3s ease;
    }

    .post-card:hover {
      transform: translateY(-5px);
      box-shadow:
        0 18px 35px rgba(90, 20, 200, 0.12),
        0 4px 14px rgba(90, 20, 200, 0.08);
    }

    /* Purple Primary Button */
    .button-primary {
      background: linear-gradient(135deg, #a56bff, #7e3aed);
      color: white;
      padding: 10px 18px;
      border-radius: 14px;
      font-weight: 600;
      transition: 0.25s;
      box-shadow: 0 4px 12px rgba(120, 45, 255, 0.3);
    }

    .button-primary:hover {
      background: linear-gradient(135deg, #b88aff, #8b5cf6);
      box-shadow: 0 6px 18px rgba(120, 45, 255, 0.45);
      transform: translateY(-2px);
    }

    /* Hashtags */
    .hashtag {
      background: #f2e8ff;
      color: #7e3aed;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }

    .hashtag:hover {
      background: #e2d4ff;
      box-shadow: 0 2px 8px rgba(120, 45, 255, 0.22);
    }

    /* Domain tag */
    .domain-tag {
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      background: #f1eaff;
      color: #6e2bf2;
      font-weight: 500;
      box-shadow: inset 0 0 6px rgba(120, 45, 255, 0.15);
    }

    textarea {
      resize: none;
    }

    /* Loading text */
    #loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #6d28d9;
      font-weight: 500;
    }
  </style>
</head>

<body class="min-h-screen flex">

  <!-- LOGIN + PROFILE GUARD -->
  <script>
    const FE_API_URL = "http://localhost:5136/api";
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");

    if (!token || !role) {
      window.location.href = "/Final.html#login";
    } else {
      const endpoint =
        role === "STUDENT"
          ? FE_API_URL + "/student/profile"
          : FE_API_URL + "/user/profile";

      fetch(endpoint, {
        headers: {
          "Authorization": "Bearer " + token
        }
      })
        .then(res => {
          if (!res.ok) throw new Error("Unauthorized");
          return res.json();
        })
        .then(profile => {
          if (!profile.isProfileComplete) {
            window.location.href = "/pages/profile.html?setup=1";
          }
        })
        .catch(() => {
          localStorage.clear();
          window.location.href = "/Final.html#login";
        });

      // Load Events directly (since api.js loads later)
      function loadEventsWidget() {
        fetch("http://localhost:5136/api/user/events", {
          headers: { "Authorization": "Bearer " + token }
        })
          .then(res => res.json())
          .then(events => {
            const container = document.getElementById('eventsList');
            if (Array.isArray(events) && events.length > 0) {
              container.innerHTML = events.slice(0, 3).map(evt => {
                const isFull = evt.maxAttendees && evt.attendeeCount >= evt.maxAttendees;
                const canRegister = !evt.isRegistered && !isFull;

                let actionBtn = '';
                if (evt.isRegistered) {
                  actionBtn = '<span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full font-medium">Registered</span>';
                } else if (isFull) {
                  actionBtn = '<span class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded-full font-medium">Full</span>';
                } else {
                  actionBtn = `<button onclick="registerEvent('${evt.id}')" class="text-xs bg-purple-600 text-white px-2 py-1 rounded hover:bg-purple-700 transition">Register</button>`;
                }

                return `
                    <div class="p-3 bg-purple-50 rounded-xl border border-purple-100 hover:shadow-md transition cursor-pointer flex flex-col gap-2">
                        <div class="flex justify-between items-start">
                            <div class="text-xs font-bold text-purple-600">${new Date(evt.date).toLocaleDateString()}</div>
                            ${actionBtn}
                        </div>
                        <div>
                            <div class="font-semibold text-gray-800 text-sm">${evt.title}</div>
                            <div class="text-xs text-gray-500 mt-1 truncate">${evt.location}</div>
                        </div>
                    </div>
                `;
              }).join('');
            } else {
              container.innerHTML = '<div class="text-sm text-gray-400">No upcoming events</div>';
            }
          })
          .catch(err => {
            console.error("Failed to load events", err);
            document.getElementById('eventsList').innerHTML = '<div class="text-sm text-gray-400">Failed to load events</div>';
          });
      }

      // Initial Load
      loadEventsWidget();

      // Global function for the button
      window.registerEvent = function (eventId) {
        api.registerForEvent(eventId).then(res => {
          if (res) {
            loadEventsWidget(); // Refresh list
            alert("Successfully registered!");
          }
        });
      };
    }
  </script>


  <!-- SIDEBAR (UNCHANGED STRUCTURE) -->
  <div class="sidebar w-64 bg-white shadow-lg p-6 flex flex-col gap-4">
    <div class="text-3xl font-semibold text-gray-900">Alumni Setu</div>

    <nav class="flex flex-col gap-2">
      <button class="nav-button p-3 text-gray-700 active-nav" onclick="window.location.href='feed.html'">
        Home
      </button>

      <button class="nav-button p-3 text-gray-700" onclick="window.location.href='profile.html'">
        Profile
      </button>

      <button class="nav-button p-3 text-gray-700" onclick="window.location.href='messages.html'">
        Messages
      </button>
      <button class="nav-button p-3 text-gray-700" onclick="window.location.href='connections.html'">
        Connections
      </button>
    </nav>

    <div class="mt-4">
      <h3 class="text-lg font-semibold text-gray-800 mb-2">Popular Hashtags</h3>
      <div class="flex flex-wrap gap-2">
        <span class="hashtag" onclick="searchByHashtag('#Tech')">#Tech</span>
        <span class="hashtag" onclick="searchByHashtag('#Mentorship')">#Mentorship</span>
        <span class="hashtag" onclick="searchByHashtag('#Career')">#Career</span>
      </div>
    </div>

    <div class="mt-4">
      <h3 class="text-lg font-semibold text-gray-800 mb-2">Upcoming Events</h3>
      <div id="eventsList" class="flex flex-col gap-3">
        <div class="text-sm text-gray-500">Loading events...</div>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT (UNCHANGED STRUCTURE) -->
  <div class="flex-1 p-10">
    <div class="max-w-4xl mx-auto">

      <div class="flex justify-between items-center mb-8">
        <h1 class="text-4xl font-semibold text-gray-900">Alumni Setu Community</h1>

        <div class="flex items-center gap-4">
          <input type="text" id="searchBar" placeholder="Search posts or hashtags..." class="input-apple w-64"
            oninput="searchPosts()" />

          <button onclick="logout()"
            class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl font-medium transition shadow-lg">
            Logout
          </button>
        </div>
      </div>

      <!-- Domain filter -->
      <div class="flex items-center gap-4 mb-6">
        <label class="text-gray-800 font-medium">Filter by Domain:</label>
        <select id="domainFilter" class="input-apple" onchange="filterPosts()">
          <option value="">All Domains</option>
          <option value="Cybersecurity">Cybersecurity</option>
          <option value="Data Science">Data Science</option>
          <option value="Artificial Intelligence">Artificial Intelligence</option>
          <option value="Software Engineering">Software Engineering</option>
          <option value="Cloud Computing">Cloud Computing</option>
        </select>
      </div>

      <!-- Upload section -->
      <div class="post-upload-section mb-8">
        <h3 class="text-2xl font-semibold text-gray-900 mb-4">Share Your Insights</h3>

        <input id="postTitle" type="text" class="input-apple w-full mb-4" placeholder="Post Title">

        <textarea id="postContent" rows="4" class="input-apple w-full mb-4" placeholder="Write your post..."></textarea>

        <div class="flex flex-wrap gap-4 mb-4">
          <input id="postHashtags" type="text" class="input-apple flex-1" placeholder="Add hashtags">

          <select id="postDomain" class="input-apple">
            <option value="">Select Domain</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Data Science">Data Science</option>
            <option value="Artificial Intelligence">Artificial Intelligence</option>
            <option value="Software Engineering">Software Engineering</option>
            <option value="Cloud Computing">Cloud Computing</option>
          </select>

          <input id="postImage" type="file" accept="image/*" class="input-apple p-2">
        </div>

        <button class="button-primary" onclick="uploadPost()">Share Post</button>
      </div>

      <!-- FEED LIST -->
      <div id="postFeed" class="space-y-6"></div>
      <div id="loading">Loading more posts...</div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script type="module" src="../js/feed.js"></script>

</body>

</html>
