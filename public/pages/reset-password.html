<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Set Password | Alumni Setu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-[#0b1220] to-[#0f172a] text-white flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-[#16161c] p-8 rounded-2xl shadow-xl">

    <h2 class="text-2xl font-bold text-center mb-2">
      Set Your Password
    </h2>

    <p class="text-sm text-center text-gray-400 mb-6">
      This is a one-time step. You may change your password now or skip.
    </p>

    <div class="space-y-4">
      <input
        id="newPassword"
        type="password"
        placeholder="New password"
        class="w-full p-3 rounded-lg bg-[#1b1b23] focus:outline-none focus:ring-2 focus:ring-purple-500"
      />

      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm new password"
        class="w-full p-3 rounded-lg bg-[#1b1b23] focus:outline-none focus:ring-2 focus:ring-purple-500"
      />

      <p id="err" class="text-red-400 text-sm"></p>

      <button
        onclick="setPassword()"
        class="w-full bg-purple-600 hover:bg-purple-700 transition p-3 rounded-lg font-semibold"
      >
        Set Password
      </button>

      <button
        onclick="skipPassword()"
        class="w-full border border-gray-600 hover:bg-[#1b1b23] transition p-3 rounded-lg text-sm"
      >
        Skip for now
      </button>
    </div>
  </div>

  <script src="/js/reset-password.js"></script>
</body>
</html>
