<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Connections | Alumni Setu</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Aurora background */
    .aurora {
      background:
        radial-gradient(circle at 20% 20%, #c084fc55, transparent 40%),
        radial-gradient(circle at 80% 30%, #818cf855, transparent 40%),
        radial-gradient(circle at 50% 80%, #a78bfa55, transparent 40%);
    }

    /* Card hover swap */
    .card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
    }
  </style>
</head>

<body class="min-h-screen aurora">

<div class="flex">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-white/70 backdrop-blur-md min-h-screen shadow-lg p-6">
    <h1 class="text-2xl font-bold mb-8">Alumni Setu</h1>

    <nav class="space-y-4 text-gray-700">
      <a href="/pages/feed.html" class="block hover:text-indigo-600">Home</a>
      <a href="/pages/profile.html" class="block hover:text-indigo-600">Profile</a>
      <a href="/pages/connections.html" class="block font-semibold text-indigo-600">
        Connections
      </a>
      <a href="/pages/messages.html" class="block hover:text-indigo-600">Messages</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-10">

    <!-- HEADER -->
    <header class="mb-10">
      <h2 class="text-3xl font-bold">Connections</h2>
      <p class="text-gray-600 mt-1">
        Find people, send requests, and manage your network
      </p>
    </header>

    <!-- SEARCH USERS -->
    <section class="card bg-white rounded-xl p-6 mb-10">
      <h3 class="text-xl font-semibold mb-4">Find People</h3>

      <input
        id="searchInput"
        type="text"
        placeholder="Search by name..."
        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-400"
        />

        <div id="searchResults" class="mt-4 space-y-3"></div>
    </section>

    <!-- PENDING REQUESTS -->
    <section class="card bg-white rounded-xl p-6 mb-10">
      <h3 class="text-xl font-semibold mb-4">Pending Requests</h3>
      <div id="requests" class="space-y-3 text-gray-600"></div>
    </section>

    <!-- CONNECTIONS -->
    <section class="card bg-white rounded-xl p-6">
      <h3 class="text-xl font-semibold mb-4">Your Connections</h3>
      <div id="connections" class="grid sm:grid-cols-2 gap-4"></div>
    </section>

  </main>
</div>

<script src="/js/connections.js"></script>
</body>
</html>
