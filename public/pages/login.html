<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

  <div class="bg-gray-800 p-6 rounded w-96">
    <h2 class="text-2xl mb-4 font-bold">Login</h2>

    <input id="email" class="w-full p-2 mb-3 bg-gray-700 rounded" placeholder="Email">
    <input id="password" type="password" class="w-full p-2 mb-4 bg-gray-700 rounded" placeholder="Password">

    <button id="loginBtn" class="w-full bg-purple-600 p-2 rounded">
      Login
    </button>

    <p id="err" class="text-red-400 mt-3"></p>
  </div>

  <!-- IMPORTANT -->
  <script src="../js/login.js"></script>
</body>
</html>
